<div class="modal fade"
     id="transactionModal"
     tabindex="-1"
     aria-labelledby="transactionModalLabel"
     aria-hidden="true">
    <div class="modal-dialog border-0 shadow">
        <div class="modal-content border-0">
            <div class="modal-header border-bottom-0 px-4 pt-4">
                <h5 class="modal-title fw-bold" id="transactionModalLabel">Record Asset Movement</h5>
                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close"></button>
            </div>
            <form id="transactionForm"
                  action="{% url 'create_transaction' %}"
                  method="post">
                {% csrf_token %}
                <div class="modal-body px-4 pb-4">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">Target Wallet</label>
                        <select class="form-select" name="wallet" required>
                            {% for wallet in wallets %}
                                <option value="{{ wallet.id }}"
                                        {% if current_filters.wallet == wallet.id|stringformat:"s" %}selected{% endif %}>
                                    {{ wallet.name }} ({{ wallet.currency }})
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">Classification Category</label>
                        <select class="form-select" name="category" required>
                            {% for cat in categories %}
                                <option value="{{ cat.id }}">{{ cat.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">Movement Type</label>
                        <div class="d-flex">
                            <div class="form-check me-4">
                                <input class="form-check-input"
                                       type="radio"
                                       name="transaction_type"
                                       id="type_out"
                                       value="OUTFLOW"
                                       checked>
                                <label class="form-check-label text-dark" for="type_out">Expense (Outflow)</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input"
                                       type="radio"
                                       name="transaction_type"
                                       id="type_in"
                                       value="INFLOW">
                                <label class="form-check-label text-dark" for="type_in">Income (Inflow)</label>
                            </div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">Transaction Value Amount</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted fw-bold">$</span>
                            <input type="number"
                                   step="0.01"
                                   min="0.01"
                                   class="form-control"
                                   name="amount"
                                   placeholder="0.00"
                                   required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">Description Log</label>
                        <input type="text"
                               class="form-control"
                               name="description"
                               placeholder="e.g., AWS Cloud Hosting, Coffee, Invoice"
                               required>
                    </div>
                    <div class="mb-0">
                        <label class="form-label small fw-semibold text-secondary">Execution Date</label>
                        <input type="date"
                               class="form-control"
                               name="date"
                               required
                               id="default-modal-date-input">
                    </div>
                </div>
                <div class="modal-footer border-top-0 px-4 pb-4">
                    <button type="button"
                            class="btn btn-light fw-semibold"
                            data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary fw-semibold px-4">Save Entry</button>
                </div>
            </form>
        </div>
    </div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const modalDateInput = document.getElementById('default-modal-date-input');
        if (modalDateInput && !modalDateInput.value) {
            modalDateInput.value = new Date().toISOString().split('T')[0];
        }
    });
</script>
